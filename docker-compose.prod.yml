# Beispiel-Betrieb auf einem Server (Azure: App Service + Azure Database for PostgreSQL, Switzerland North).
# Lokal testen: docker compose -f docker-compose.prod.yml --env-file .env up --build
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: bbz, POSTGRES_PASSWORD: "${DB_PASSWORD:-bbz}", POSTGRES_DB: bbz }
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://bbz:${DB_PASSWORD:-bbz}@db:5432/bbz
      MIGRATE_ON_START: "true"
    ports: [ "3000:3000" ]
    depends_on: [ db ]
  worker:
    build: .
    env_file: .env
    environment: { DATABASE_URL: "postgres://bbz:${DB_PASSWORD:-bbz}@db:5432/bbz" }
    command: ["npx", "tsx", "src/integrations/workerMain.ts"]
    depends_on: [ app ]
volumes:
  pgdata:
